#
# The launch on one machine: the two images from images.yml behind Caddy. See README.md here.
#
#   cp launch.env.example .env   # then edit
#   docker compose pull && docker compose up -d
#
# Updating is the same two commands after a new release; set SITE_TAG and ENVELOPE_TAG in .env to
# pin a version, otherwise :latest.
name: clapandpay

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - site
      - envelope

  # clapandpay.com
  site:
    image: ghcr.io/maximedogawa/clapandpay/clapandpay-web:${SITE_TAG:-latest}
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true

  # envelope.clapandpay.com
  envelope:
    image: ghcr.io/maximedogawa/clapandpay/green-envelope:${ENVELOPE_TAG:-latest}
    restart: unless-stopped
    environment:
      NETWORK: ${NETWORK:-mainnet}
      PUBLIC_ORIGIN: https://envelope.clapandpay.com
      CHAIN_ENDPOINTS: ${CHAIN_ENDPOINTS:-}
      TYPESAFE_API_KEY: ${TYPESAFE_API_KEY:-}
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true

volumes:
  caddy-data:
  caddy-config:
