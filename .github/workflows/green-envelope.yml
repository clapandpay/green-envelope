#
# The Green Envelope image (the claim page, the wallet and the link-preview handler), built for
# linux/amd64 and linux/arm64 and pushed to ghcr.io as ghcr.io/<owner>/<repo>/green-envelope. No tests,
# no pull-request or merge triggers: a person publishes a release tagged
# green-envelope-v<version> (it must match package.json), or starts it by hand, and gets an
# image to deploy. Tests are run locally (AGENTS.md).
#
# DIR is the product's folder: '.' here, as it was 'green-envelope' in the clapandpay monorepo.
#
# Never put a schedule on this workflow (AGENTS.md, CI).
name: Image green-envelope

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Image tag (empty => latest)'
        required: false
        type: string

permissions:
  contents: read

env:
  DIR: .
  IMAGE_NAME: green-envelope

concurrency:
  group: ${{ github.workflow }}-${{ github.event.release.tag_name || github.run_id }}
  cancel-in-progress: false

jobs:
  image:
    name: Image
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.release.tag_name, 'green-envelope-v')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # The release number lives in package.json and the app's footer shows it, so a tag that
      # says something else would ship an image that names the wrong release.
      - name: Tag matches the version
        if: github.event_name == 'release'
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          VERSION=$(node -p "require('./$DIR/package.json').version")
          if [ "$RELEASE_TAG" != "green-envelope-v$VERSION" ]; then
            echo "::error::tag $RELEASE_TAG does not match $DIR/package.json ($VERSION): bump the version or fix the tag"
            exit 1
          fi

      # The tag has to look like a Docker tag before it is used; it never picks a path.
      - name: Work out the tags
        id: meta
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          TAG_INPUT: ${{ inputs.tag }}
          PRERELEASE: ${{ github.event.release.prerelease }}
          REPO: ${{ github.repository }}
        run: |
          IMAGE="ghcr.io/$REPO/$IMAGE_NAME"
          if [ "$EVENT_NAME" = "release" ]; then TAG="$RELEASE_TAG"; else TAG="${TAG_INPUT:-latest}"; fi
          if ! printf '%s' "$TAG" | grep -Eq '^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$'; then
            echo "::error::'$TAG' is not a valid image tag"
            exit 1
          fi
          {
            echo "tags<<EOF"
            echo "$IMAGE:$TAG"
            # :latest is what an unattended deployment follows, so a prerelease must not move it.
            if [ "$PRERELEASE" != "true" ] && [ "$TAG" != "latest" ]; then echo "$IMAGE:latest"; fi
            echo "EOF"
            # The testnet site (testnet.envelope.clapandpay.com) runs the same code built for
            # testnet11: the same tags with -testnet.
            echo "testnet<<EOF"
            echo "$IMAGE:$TAG-testnet"
            if [ "$PRERELEASE" != "true" ] && [ "$TAG" != "latest" ]; then echo "$IMAGE:latest-testnet"; fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      # arm64 is emulated, but only where it has to be: the Dockerfile builds the web bundle once,
      # natively, and the runtime stage installs two pure-JavaScript packages.
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ${{ env.DIR }}
          file: ${{ env.DIR }}/deployment/Dockerfile
          platforms: linux/amd64,linux/arm64
          # The footer names the commit, /hello the faucet. The faucet values are repository
          # variables (Settings, Variables), empty until it exists.
          build-args: |
            GIT_COMMIT=${{ github.sha }}
            VITE_FAUCET_URL=${{ vars.FAUCET_URL }}
            VITE_FAUCET_ORIGINS=${{ vars.FAUCET_ORIGINS }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha,scope=${{ env.IMAGE_NAME }}
          cache-to: type=gha,scope=${{ env.IMAGE_NAME }},mode=max
          provenance: false

      # The same image for testnet.envelope.clapandpay.com: only the web bundle's network differs,
      # so the dependency layers come from the cache of the build above.
      - uses: docker/build-push-action@v6
        with:
          context: ${{ env.DIR }}
          file: ${{ env.DIR }}/deployment/Dockerfile
          platforms: linux/amd64,linux/arm64
          build-args: |
            GIT_COMMIT=${{ github.sha }}
            VITE_NETWORK=testnet11
            VITE_FAUCET_URL=${{ vars.FAUCET_URL }}
            VITE_FAUCET_ORIGINS=${{ vars.FAUCET_ORIGINS }}
          push: true
          tags: ${{ steps.meta.outputs.testnet }}
          cache-from: type=gha,scope=${{ env.IMAGE_NAME }}
          provenance: false

      - name: Say where it went
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          TESTNET: ${{ steps.meta.outputs.testnet }}
        run: |
          {
            echo "### $IMAGE_NAME"
            echo '```'
            echo "$TAGS"
            echo "$TESTNET"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
