# SPDX-License-Identifier: AGPL-3.0-or-later
# Licences of the vector generator's dependencies: `cargo deny --locked check licenses`.
# The allowlist is what Cargo.lock needs (from `cargo metadata`), nothing more: a dependency
# under any other licence (GPL, AGPL, SSPL, ...) fails the check until someone looks at it.
# Advisories are checked separately, not here.

[graph]
all-features = true

[licenses]
confidence-threshold = 0.9
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception", # target-lexicon
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "Unicode-3.0",          # icu_*, zerovec and friends, via url and idna
  "MPL-2.0",              # colored: file-level copyleft
  "CC0-1.0",              # bip39, bitcoin_hashes
]

# This crate is ours (AGPL-3.0-or-later) and never published.
[licenses.private]
ignore = true
