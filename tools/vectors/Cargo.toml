[package]
name = "ge-vectors"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
description = "Golden test vectors and spend-bundle verifier for @ge/chia, built on chia-wallet-sdk"
publish = false

[dependencies]
anyhow = "1"
# The same bip39 as Klimper (Sage imports a mnemonic with it), for the 24-word wallet vectors.
bip39 = "=2.2.1"
chia-wallet-sdk = "=0.33.0"
hex = "0.4"
hkdf = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[profile.release]
opt-level = 2
debug = false
