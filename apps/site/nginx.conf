server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # No cookies, no third parties: the policy says so and the browser enforces it.
  add_header Content-Security-Policy "default-src 'none'; img-src 'self' data:; style-src 'unsafe-inline'; script-src 'unsafe-inline'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

  gzip on;
  gzip_types text/html text/css application/javascript image/svg+xml;

  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  location / {
    # The page is one file that changes with a release: let a browser keep it, but ask each time.
    add_header Cache-Control "no-cache" always;
    try_files $uri $uri/ =404;
  }
}
