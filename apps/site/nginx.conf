server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # No cookies, no third parties: the policy says so and the browser enforces it.
  include /etc/nginx/security-headers.conf;

  gzip on;
  gzip_types text/html text/css application/javascript image/svg+xml application/json;

  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  # What Apple and Android read to tie the Klimper app to clapandpay.com: passkeys
  # (webcredentials) and universal links. The files have no extension, so the type is set here, and
  # they must be answered directly, never redirected.
  location /.well-known/ {
    default_type application/json;
    add_header Cache-Control "public, max-age=3600" always;
    include /etc/nginx/security-headers.conf;
    try_files $uri =404;
  }

  # The Klimper download. Until the TestFlight public link exists this lands on the Klimper
  # section of the page. Put the link here and release the site again: it is the one place.
  location = /klimper {
    add_header Cache-Control "no-cache" always;
    include /etc/nginx/security-headers.conf;
    return 302 /#klimper;
  }

  location / {
    # The page is one file that changes with a release: let a browser keep it, but ask each time.
    add_header Cache-Control "no-cache" always;
    include /etc/nginx/security-headers.conf;
    try_files $uri $uri/ =404;
  }
}
