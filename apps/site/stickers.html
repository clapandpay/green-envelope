<!-- Clap and Pay hand stickers. One file, inline SVG, no requests. Same hand construction as index.html. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Clap and Pay stickers</title>
<meta name="color-scheme" content="light dark">
<style>
:root{--bg:#FFFCF6;--ink:#14141A;--mut:#5E5A55;--hink:#14141A;--skin:#FFC31F;--shade:#F09A10;--hi:#FFF3C8;--cuff:#FFFCF6;--band:#0A5CFF;--mis:rgba(10,92,255,.22);--halo:#FFFCF6;--card:#F6EFE0;--line:rgba(20,20,26,.2)}
@media(prefers-color-scheme:dark){:root{--bg:#0C0C10;--ink:#FFF6E8;--mut:#A9A6A0;--halo:#FFF6E8;--card:#16161C;--mis:rgba(74,139,255,.3);--line:rgba(255,246,232,.2)}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:400 1rem/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;padding:40px 20px 80px}
main{max-width:1200px;margin:0 auto}
h1{font:800 clamp(2.6rem,7vw,5rem)/.95 ui-rounded,"SF Pro Rounded",Nunito,system-ui,sans-serif;letter-spacing:-.045em;margin:0 0 8px}
p{margin:0 0 28px;color:var(--mut);max-width:40rem}
.mono{font:600 .72rem/1.3 ui-monospace,"SF Mono",Menlo,monospace;letter-spacing:.09em;text-transform:uppercase;color:var(--mut)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:24px}
figure{margin:0;background:var(--card);border:2px solid var(--ink);border-radius:8px;box-shadow:6px 6px 0 var(--ink);padding:18px 18px 14px;display:flex;flex-direction:column;gap:10px}
figure svg{width:100%;height:260px;overflow:visible}
figure.w2{grid-column:span 2}
.tint{--halo:transparent}
.red{--skin:#FF6B63;--shade:#E23338;--hi:#FFD6D2;--band:#FF4747}
.blue{--skin:#4C8DFF;--shade:#0A5CFF;--hi:#CFE0FF;--band:#FFC31F}
.sm figure svg{height:150px}
@media(max-width:560px){figure.w2{grid-column:auto}}
</style>
</head>

<main>
<p class="mono">Clap and Pay · hand set</p>
<h1>Hands you can send in a chat.</h1>
<p>One hand construction: a chubby palm, four rounded fingers, a thumb, a cuff, a thick ink outline, a cream sticker edge and a faint offset print. Poses are rotations and mirrors of it.</p>
<div class="grid">
 <figure class="w2"><svg viewBox="-190 -230 380 330"><g transform="translate(-52 0) rotate(13)"><use href="#open"/></g><g transform="translate(52 0) scale(-1 1) rotate(13)" style="--band:#FF4747"><use href="#open"/></g><g transform="translate(0 -168)"><use href="#spk" transform="scale(.42)" fill="#FFF6D8" stroke="#14141A" stroke-width="9" stroke-linejoin="round"/></g><path d="M-60 -204L-40 -186M-14 -222L-8 -196" stroke="var(--ink)" stroke-width="7" stroke-linecap="round" fill="none"/></svg><figcaption class="mono">Clap</figcaption></figure>

 <figure><svg viewBox="-110 -230 220 330"><use href="#h-pay"/></svg><figcaption class="mono">Pay</figcaption></figure>
 <figure><svg viewBox="-110 -230 220 330"><use href="#th"/></svg><figcaption class="mono">Thumbs up</figcaption></figure>
