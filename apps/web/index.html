<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Green Envelope</title>
    <meta name="description" content="Money as a link in your group chat. Tap, open, it is yours. No app, no account." />
    <meta name="theme-color" content="#f4f0e8" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0e130c" media="(prefers-color-scheme: dark)" />
    <meta name="color-scheme" content="light dark" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="referrer" content="no-referrer" />
    <!-- Defaults. The edge service replaces these per envelope for the chat preview. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Clap and Pay" />
    <meta property="og:title" content="🟢 A green envelope for you" />
    <meta property="og:description" content="Tap to open. No app, no account." />
    <meta name="twitter:card" content="summary" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <style>
      /* First paint before the stylesheet: the right paper colour, no flash. */
      html { background: #f4f0e8; color: #1c1b19; }
      @media (prefers-color-scheme: dark) { html { background: #0e130c; color: #f4f0e8; } }
      noscript p { max-width: 26em; margin: 20vh auto; padding: 0 16px; font: 700 1.25rem/1.4 system-ui, sans-serif; text-align: center; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <noscript>
      <p>
        Dieser Umschlag braucht JavaScript zum Öffnen. Bitte schalte es ein oder öffne den Link in deinem normalen Browser.<br /><br />
        This envelope needs JavaScript to open. Please switch it on, or open the link in your regular browser.
      </p>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
