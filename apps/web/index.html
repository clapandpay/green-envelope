<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Green Envelope</title>
    <meta name="description" content="Money as a link in your group chat. Tap, open, it is yours. No app, no account." />
    <meta name="theme-color" content="#f3ead3" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#20231b" media="(prefers-color-scheme: dark)" />
    <meta name="color-scheme" content="light dark" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="referrer" content="no-referrer" />
    <!-- Defaults. The edge service replaces these per envelope for the chat preview. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Clap and Pay" />
    <meta property="og:title" content="🟢 A green envelope for you" />
    <meta property="og:description" content="Tap to open. No app, no account." />
    <meta name="twitter:card" content="summary" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='2' y='6' width='28' height='20' rx='4' fill='%232fbf5f' stroke='%231b1a17' stroke-width='3'/%3E%3Cpath d='M3 8l13 10L29 8' fill='none' stroke='%231b1a17' stroke-width='3' stroke-linejoin='round'/%3E%3C/svg%3E"
    />
    <style>
      /* First paint before the stylesheet: the right paper colour, no flash. */
      html { background: #f3ead3; color: #1b1a17; }
      @media (prefers-color-scheme: dark) { html { background: #20231b; color: #f3ead3; } }
      noscript p { max-width: 26em; margin: 20vh auto; padding: 0 16px; font: 700 1.25rem/1.4 system-ui, sans-serif; text-align: center; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <noscript>
      <p>
        Dieser Umschlag braucht JavaScript zum Öffnen. Bitte schalte es ein oder öffne den Link in deinem normalen Browser.<br /><br />
        This envelope needs JavaScript to open. Please switch it on, or open the link in your regular browser.
      </p>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
